<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja de Sabonetes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        /* Cores */
        :root {
            --bg-header: #ffe4e6;
            --bg-logo: #ffcdd2;
            --bg-nav: #e0f7fa;
            --bg-sec-banner: #f8d7da;
            --bg-sec-cat: #d4edda;
            --bg-sec-ingred: #ffe8cc;
            --bg-sec-prod: #fce4ec;
            --bg-footer: #f3e5f5;
            --btn-light: #fff3e0;
            --btn-add: #c8e6c9;
            --border-color: #555;
            --placeholder-gray: #d9d9d9;
        }

        /* Reset Básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #f5f5f5;
            padding: 40px 20px;
            font-family: sans-serif;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            min-width: 900px;
        }

        /* Header e Pesquisa */
        header {
            background-color: var(--bg-header);
            padding: 15px 30px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-height: 80px;
        }

        .logo-container {
            background-color: var(--bg-logo);
            width: 150px;
            height: 45px;
            border-radius: 4px;
        }

        .search-container {
            position: relative;
            flex: 1;
            margin: 0 50px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
        }

        #search {
            display: block;
            width: 100%; 
            height: 40px;
            background-color: #fff;
            border: 1px solid #fbdcdc;
            border-radius: 20px;
            padding: 0 15px 0 40px;
            outline: none;
        }   

        /* Caixa de sugestões */
        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #fff;
            border: 1px solid #fbdcdc;
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .suggestion-item:hover {
            background-color: #fce4ec;
        }

        .header-icons {
            margin-left: auto;
            width: 120px;
            height: 25px;
            background-color: var(--placeholder-gray);
            border-radius: 3px;
        }

        nav {
            background-color: var(--bg-nav);
            height: 60px;
        }

        main {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        section {
            padding: 40px 30px;
            border-radius: 4px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            height: 25px;
        }

        .header-title-placeholder {
            width: 180px;
            height: 25px;
            background-color: rgba(0,0,0,0.1);
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-weight: bold;
        }

        .btn-VerTodos {
            width: 80px;
            height: 25px;
            background-color: rgba(0,0,0,0.1);
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .split-section {
            display: flex;
            flex-direction: row;
            gap: 40px;
        }

        .sec-banner { background-color: var(--bg-sec-banner); }
        .sec-ingredients { background-color: var(--bg-sec-ingred); }
        
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 150px;
        }

        .image-content { flex: 1; display: flex; }
        
        .img-placeholder {
            background-color: #fff;
            border: 1px solid var(--border-color);
            width: 100%;
            min-height: 250px;
        }

        .btn {
            width: 150px;
            height: 45px;
            background-color: var(--btn-light);
            border-radius: 4px;
            margin-top: 30px;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 30px;
            padding-bottom: 10px;
        }

        .sec-categories { background-color: var(--bg-sec-cat); }
        
        .item-circulo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #fff;
            flex-shrink: 0;
        }

        .sec-produtos { background-color: var(--bg-sec-prod); }
        
        .produto-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 180px;
            flex-shrink: 0;
        }

        .produto-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fff;
        }

        .produto-info, .produto-title {
            background-color: rgba(0,0,0,0.05);
            border-radius: 4px;
            padding: 5px;
        }

        .produto-info { height: 50px; }
        
        .btn-add {
            background-color: var(--btn-add);
            height: 35px;
            width: 100%;
            border-radius: 4px;
            margin-top: 5px;
        }

        /* ESTILIZANDO A DIV DE NÃO ENCONTRADO PARA FICAR BONITA */
        #no_results {
            display: none; 
            text-align: center; 
            padding: 50px 20px;
            font-size: 18px;
            color: #555;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        footer {
            background-color: var(--bg-footer);
            height: 100px;
        }
    </style>
</head>
<body>

<div class="page-container">
    <header>
        <div class="logo-container"></div>
        
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search" placeholder="Pesquisar produtos...">
            <div id="suggestions" class="suggestions-dropdown"></div> 
        </div>
        
        <div class="header-icons"></div>
    </header>

   <nav></nav>

   <main>
       <!-- Seções ocultadas para encurtar, deixei só a de produtos onde acontece a ação -->
       <section class="sec-produtos">
           <div class="section-header">
               <div class="header-title-placeholder">Produtos</div>
               <a href="#" class="btn-VerTodos">Ver todos</a>
           </div>

            <!-- AQUI ESTÁ NOSSA MENSAGEM -->
            <div id="no_results">
                <i class="fa-solid fa-box-open" style="font-size: 40px; color: #999; margin-bottom: 15px; display: block;"></i>
                Ops! Nenhum produto encontrado com esse nome.
            </div>

           <div class="scroll-container">
               <div class="produto-card">
                   <div class="produto-img"></div>
                   <div class="produto-title">Sabonete de Morango</div>
                   <div class="produto-info">Sabonete com cheiro forte de Morango</div>
                   <div class="btn-add"></div>
               </div>
               <div class="produto-card">
                   <div class="produto-img"></div>
                   <div class="produto-title">Sabonete de Melancia</div>
                   <div class="produto-info">Sabonete refrescante de Melancia</div>
                   <div class="btn-add"></div>
               </div>
               <div class="produto-card">
                   <div class="produto-img"></div>
                   <div class="produto-title">Sabonete de Mirtilo</div>
                   <div class="produto-info">Sabonete relaxante de Mirtilo</div>
                   <div class="btn-add"></div>
               </div>
           </div>
       </section>
   </main>

   <footer></footer>
</div>

<script>
    const searchInput = document.getElementById('search');
    const suggestionsBox = document.getElementById('suggestions');
    const noResults = document.getElementById('no_results');

    searchInput.addEventListener('input', (event) => {
        const value = formatString(event.target.value);
        const items = document.querySelectorAll('.produto-card');

        let hasResults = false;
        
        // Limpa a caixa de sugestões
        if (suggestionsBox) suggestionsBox.innerHTML = ''; 

        if(value !== ''){
            items.forEach(item => {
                const titleElement = item.querySelector('.produto-title');
                const descElement = item.querySelector('.produto-info');
                
                const itemTitle = titleElement ? titleElement.textContent : '';
                const itemDescription = descElement ? descElement.textContent : '';

                // Verifica se o texto digitado bate com título OU descrição
                if(formatString(itemTitle).includes(value) || formatString(itemDescription).includes(value)) {
                    item.style.display = 'flex'; // Mostra o card
                    hasResults = true;

                    // Cria a sugestão clicável na barra de baixo
                    const suggestionItem = document.createElement('div');
                    suggestionItem.classList.add('suggestion-item');
                    suggestionItem.textContent = itemTitle; 
                    
                    suggestionItem.addEventListener('click', () => {
                        searchInput.value = itemTitle; 
                        if (suggestionsBox) suggestionsBox.style.display = 'none'; 
                        searchInput.dispatchEvent(new Event('input')); 
                    });

                    if (suggestionsBox) suggestionsBox.appendChild(suggestionItem);
                    
                } else {
                    item.style.display = 'none'; // Esconde o card
                } 
            });

            // Se achou resultado, esconde o alerta e mostra sugestões. Se não, faz o contrário.
            if (hasResults){
                if (noResults) noResults.style.display = 'none';
                if (suggestionsBox) suggestionsBox.style.display = 'block'; 
            } else {
                if (noResults) noResults.style.display = 'block'; 
                if (suggestionsBox) suggestionsBox.style.display = 'none'; 
            }
            
        } else {
            // Se o usuário apagar tudo na barra (voltar a ficar vazio), mostra tudo de novo.
            items.forEach(item => item.style.display = 'flex');
            if (noResults) noResults.style.display = 'none';
            if (suggestionsBox) suggestionsBox.style.display = 'none'; 
        }
    });

    // Fechar sugestões clicando fora
    document.addEventListener('click', (event) => {
        if (suggestionsBox && !searchInput.contains(event.target) && !suggestionsBox.contains(event.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

    function formatString(value){
        return value
            .toLowerCase()
            .trim()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');
    }
</script>
</body>
</html>
